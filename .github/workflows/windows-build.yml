name: Windows Build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish portable Windows executable
        run: dotnet publish src/InstantTransparentBuilds/InstantTransparentBuilds.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: InstantTransparentBuilds-win-x64
          path: dist/**
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath InstantTransparentBuilds-win-x64.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" InstantTransparentBuilds-win-x64.zip --title "Instant Transparent Builds ${{ github.ref_name }}" --notes "Windows preview companion; no game modifications."
