name: Windows Build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows app
        shell: pwsh
        run: |
          dotnet publish src/InstantTransparentBuilds/InstantTransparentBuilds.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist/app
          dotnet publish src/InstantTransparentBuilds.Updater/InstantTransparentBuilds.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist/updater
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/app/InstantTransparentBuilds.exe package/
          Copy-Item dist/updater/InstantTransparentBuilds.Updater.exe package/
      - name: Upload portable exe files
        uses: actions/upload-artifact@v4
        with:
          name: InstantTransparentBuilds-win-x64
          path: package/*
      - name: Create release zip + SHA-256
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath InstantTransparentBuilds-win-x64.zip
          $sum = (Get-FileHash InstantTransparentBuilds-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path InstantTransparentBuilds-win-x64.zip.sha256 -Value $sum -NoNewline
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'v0.2.0' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag InstantTransparentBuilds-win-x64.zip InstantTransparentBuilds-win-x64.zip.sha256 --clobber
          } else {
            gh release create $tag InstantTransparentBuilds-win-x64.zip InstantTransparentBuilds-win-x64.zip.sha256 --target $env:GITHUB_SHA --title "Instant Transparent Builds $tag" --notes "Windows preview companion with in-app update installer. Game assets are not modified."
          }
